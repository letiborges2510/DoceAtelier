name: CI/CD - Doce Atelier

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-cd.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            jar_dir: target
            hook: RENDER_HOOK_GATEWAY
          - service: login
            jar_dir: springframework/target
            hook: RENDER_HOOK_LOGIN
          - service: gestao
            jar_dir: springframework/target
            hook: RENDER_HOOK_GESTAO
          - service: venda
            jar_dir: springframework/target
            hook: RENDER_HOOK_VENDA
          - service: relatorio
            jar_dir: springframework/target
            hook: RENDER_HOOK_RELATORIO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            JAR_DIR=${{ matrix.jar_dir }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/doce-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/doce-${{ matrix.service }}:${{ github.sha }}

      - name: Disparar deploy no Render
        env:
          HOOK: ${{ secrets[matrix.hook] }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "Hook do Render ainda nao cadastrado, pulando"
          fi
